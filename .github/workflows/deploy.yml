name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and deploy with Docker Compose
        run: |
          cd /home/runner/app/IOT-Powered-Hospital-Delivery-Robot-with-AI
          docker compose down
          docker compose build --no-cache
          docker compose up -d
