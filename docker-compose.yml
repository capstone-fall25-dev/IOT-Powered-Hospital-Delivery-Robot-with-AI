version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: hospital_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1239
      MYSQL_DATABASE: robotmanager
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1239"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./Robot_Medicial_BE
      dockerfile: Dockerfile
    container_name: hospital_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy   # ← Quan trọng: đợi MySQL healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=robotmanager;User=root;Password=1239;
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./Robot_Medicial_FE
      dockerfile: Dockerfile
    container_name: hospital_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql_data: